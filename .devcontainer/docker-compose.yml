# Supporting infrastructure for the dev container.
# Started automatically by devcontainer.json initializeCommand:
#   docker compose -f .devcontainer/docker-compose.yml up -d

services:
  # Redis
  redis:
    image: redis:7-alpine
    container_name: toolbox-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - toolbox-network

  # RedisInsight - Redis GUI
  redis-insight:
    image: redis/redisinsight:latest
    container_name: toolbox-redis-insight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - toolbox-network

  # MySQL 8.4
  mysql:
    image: mysql:8.4
    container_name: toolbox-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: toolbox
      MYSQL_DATABASE: toolbox
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptoolbox"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - toolbox-network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: toolbox-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: toolbox
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - toolbox-network

volumes:
  redis-data:
    driver: local
  redisinsight-data:
    driver: local
  mysql-data:
    driver: local

networks:
  toolbox-network:
    driver: bridge
